name: CI

on:
  push:
    branches: [main, feat/voxa-dashboard-complete]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint + Format check (Biome)
        run: npx biome check .

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_VOXA_API_URL: https://ci-placeholder.example.com
          NEXT_PUBLIC_APP_URL: https://ci-placeholder.example.com

      - name: Check for direct fetch() outside lib/services
        run: |
          if grep -rn "fetch(" src/ --include="*.ts" --include="*.tsx" \
            | grep -v "src/lib/services/" \
            | grep -v "\.test\." \
            | grep -v "\.spec\." \
            | grep -v "src/app/dashboard/quickstart/" \
            | grep -q .; then
            echo "❌ Direct fetch() found outside src/lib/services/"
            grep -rn "fetch(" src/ --include="*.ts" --include="*.tsx" \
              | grep -v "src/lib/services/" \
              | grep -v "\.test\." \
              | grep -v "\.spec\." \
              | grep -v "src/app/dashboard/quickstart/"
            exit 1
          fi
          echo "✅ No direct fetch() usage found outside src/lib/services/"
